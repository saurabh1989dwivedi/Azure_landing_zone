pool: Agent-Burst

trigger:
- main
- feature/*

stages:
  - stage: plan
    displayName: plan
    jobs:
      - job: plan
        displayName: plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/preprod'
              backendServiceArm: 'service-connection'
              backendAzureRmResourceGroupName: 'newrg'
              backendAzureRmStorageAccountName: 'samplesto777'
              backendAzureRmContainerName: 'container'
              backendAzureRmKey: 'terraform.tfstate'

